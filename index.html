<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: black;
    }
    /* Make the iframe fill the viewport (covers 1920x1080 and scales responsively) */
    iframe#videoFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe
    id="videoFrame"
    src="https://player.bilibili.com/player.html?isOutside=true&aid=80433022&bvid=BV1GJ411x7h7&cid=137649199&p=1"
    width="1920"
    height="1080"
    scrolling="no"
    frameborder="0"
    allowfullscreen>
  </iframe>
</body>
</html>
